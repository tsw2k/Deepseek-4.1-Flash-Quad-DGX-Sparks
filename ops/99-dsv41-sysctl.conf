# Lever L7, adopted 2026-09-17: keep hard free memory on a GB10, where the page cache and the
# GPU draw on the same pool. Install on every node:
#
#   sudo install -m 644 ops/99-dsv41-sysctl.conf /etc/sysctl.d/99-dsv41.conf && sudo sysctl --system
#
# Measured effect (results/2026-09-16-L7-sysctls/NOTES.md): MemFree per node 1-5 GiB -> 7-9 GiB,
# prefill and the 131K needle unchanged within 1-4 %. The reserve is subtracted from MemAvailable,
# so a node reads ~10 GiB lower there and launch/node.sh's floor allows for it.
# Tech2Wild recommend the same two values in their node prep.

# 1 GiB kept free, so reclaim starts before an allocation has to wait for it
vm.min_free_kbytes = 1048576
# watermarks at 2 % of the zone instead of 0.1 %: reclaim runs further ahead of the allocator
vm.watermark_scale_factor = 200
